<script>
/* ===== standalone storage layer: Supabase stands in for claude.ai db / assets / downloads ===== */
const SUPA_URL="https://qkyivnwukflnkixrsxhm.supabase.co",SUPA_KEY="sb_publishable_uUOvq4E953BLunsr6NB7fg_cjBc2B5O";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const IMG_BASE=SUPA_URL+"/storage/v1/object/public/images/";
let UID=null;
const ST={cols:{},stamp:{},subs:[],loading:{}};

function colMap(c){return ST.cols[c]||(ST.cols[c]=new Map())}
function colSnap(c,order){let docs=[...colMap(c).entries()].map(([id,d])=>({id,data:()=>d}));
  if(order)docs.sort((a,b)=>{const x=a.data()[order]??0,y=b.data()[order]??0;return x>y?1:x<y?-1:0});return{docs}}
function docSnap(c,id){const d=colMap(c).get(id);return{id,exists:!!d,data:()=>d}}
function emit(c){for(const s of ST.subs)if(s.col===c){try{s.cb(s.id!=null?docSnap(c,s.id):colSnap(c,s.order))}catch(e){console.error(e)}}}
async function loadCol(c){
  const{data,error}=await sb.from("docs").select("id,data,updated_at").eq("col",c);if(error)throw error;
  const m=new Map();for(const r of data){m.set(r.id,r.data);ST.stamp[c+"/"+r.id]=r.updated_at}ST.cols[c]=m;emit(c)}
function listen(sub){ST.subs.push(sub);
  if(!ST.loading[sub.col])ST.loading[sub.col]=loadCol(sub.col).catch(e=>{ST.loading[sub.col]=null;sub.err&&sub.err(e)});
  else ST.loading[sub.col].then(()=>emit(sub.col));
  return()=>{ST.subs=ST.subs.filter(s=>s!==sub)}}
async function writeDoc(c,id,d){
  const ts=new Date().toISOString();colMap(c).set(id,d);ST.stamp[c+"/"+id]=ts;emit(c);
  const{error}=await sb.from("docs").upsert({owner:UID,col:c,id,data:d,updated_at:ts},{onConflict:"owner,col,id"});
  if(error){loadCol(c).catch(()=>{});throw error}}
function docRef(c,id){return{
  set:d=>writeDoc(c,id,JSON.parse(JSON.stringify(d))),
  update:p=>{const cur=colMap(c).get(id);if(!cur)return Promise.reject({code:"not_found"});return writeDoc(c,id,JSON.parse(JSON.stringify({...cur,...p})))},
  delete:async()=>{colMap(c).delete(id);emit(c);const{error}=await sb.from("docs").delete().eq("col",c).eq("id",id);if(error){loadCol(c).catch(()=>{});throw error}},
  onSnapshot:(cb,err)=>listen({col:c,id,cb,err})}}
const SDB={
  collection:c=>({doc:id=>docRef(c,id),onSnapshot:(cb,err)=>listen({col:c,cb,err}),orderBy:f=>({onSnapshot:(cb,err)=>listen({col:c,order:f,cb,err})})}),
  doc:path=>{const[c,id]=path.split("/");return docRef(c,id)}};

function startRealtime(){
  sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    if(p.eventType==="DELETE"){const o=p.old||{};if(o.col&&o.id&&ST.cols[o.col]){ST.cols[o.col].delete(o.id);emit(o.col)}return}
    const r=p.new;if(!r||!r.col)return;const k=r.col+"/"+r.id;
    if(ST.stamp[k]&&r.updated_at&&r.updated_at<ST.stamp[k])return;   // an older echo of a write we already applied
    ST.stamp[k]=r.updated_at;colMap(r.col).set(r.id,r.data);emit(r.col)
  }).subscribe(s=>{if(s==="SUBSCRIBED")refreshAll()});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshAll()});
  window.addEventListener("online",refreshAll)}
function refreshAll(){for(const c of Object.keys(ST.cols))loadCol(c).catch(()=>{})}

/* images: public bucket, random 128-bit ids; big files are shrunk before upload to stay inside the free 1GB */
async function shrinkImage(f){
  if(!f||f.size<=1.6e6||!/^image\/(png|jpeg|webp)$/.test(f.type||""))return f;
  try{const b=await createImageBitmap(f);const k=Math.min(1,3000/Math.max(b.width,b.height));
    const cv=document.createElement("canvas");cv.width=Math.round(b.width*k);cv.height=Math.round(b.height*k);
    cv.getContext("2d").drawImage(b,0,0,cv.width,cv.height);b.close&&b.close();
    const out=await new Promise(r=>cv.toBlob(r,"image/webp",.92));return out&&out.size<f.size?out:f}catch(e){return f}}
const newId=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/[^0-9a-f]/gi,"").slice(0,32);
async function putImage(id,blob,upsert){
  const b=await shrinkImage(blob);
  const{error}=await sb.storage.from("images").upload(id,b,{contentType:b.type||"image/png",cacheControl:"31536000",upsert:!!upsert});
  if(error)throw error;return{id}}
const SASSETS={upload:f=>putImage(newId(),f,false),delete:async id=>{const{error}=await sb.storage.from("images").remove([id]);if(error)throw error}};

const SDOWNLOADS={save:async({filename,data})=>{
  const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);return{status:"saved"}}};

/* ---- login ---- */
function loginScreen(){return new Promise(res=>{
  const w=document.createElement("div");w.className="login";
  w.innerHTML=`<form><div class="logo-big" role="img" aria-label="FEVERPLUSM ZERO"></div><h2>커미션 작업실</h2>
    <label>이메일<input type="email" name="e" autocomplete="username" required></label>
    <label>비밀번호<input type="password" name="p" autocomplete="current-password" required></label>
    <button class="btn pri" type="submit">로그인</button><p class="hint" id="lgMsg"></p></form>`;
  document.body.appendChild(w);
  w.querySelector("form").onsubmit=async e=>{e.preventDefault();const f=e.target;const m=w.querySelector("#lgMsg");m.textContent="로그인하는 중…";
    const{data,error}=await sb.auth.signInWithPassword({email:f.e.value.trim(),password:f.p.value});
    if(error){m.textContent="이메일이나 비밀번호가 맞지 않아요";return}w.remove();res(data.session)}})}
async function standaloneInit(){
  let{data:{session}}=await sb.auth.getSession();
  if(!session)session=await loginScreen();
  UID=session.user.id;
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT")location.reload();else if(s)UID=s.user.id});
  startRealtime();
  db=SDB;assets=SASSETS;downloads=SDOWNLOADS}

/* ---- import a ZIP made by the old claude.ai version (or this one) ---- */
async function importBackup(file,msg){
  if(!window.JSZip)throw new Error("zip");
  const zip=await JSZip.loadAsync(file);const jf=zip.file("data.json");if(!jf)throw new Error("nodata");
  const d=JSON.parse(await jf.async("string"));const paths=d.imgPaths||{};
  const ids=Object.keys(paths);let n=0,fail=0;
  for(const id of ids){n++;msg(`이미지 올리는 중… ${n}/${ids.length}`);
    try{const zf=zip.file(paths[id]);if(!zf)throw 0;const raw=await zf.async("blob");
      const ext=(paths[id].split(".").pop()||"").toLowerCase();const type={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",gif:"image/gif"}[ext]||"image/png";
      await putImage(id,new Blob([raw],{type}),true)}catch(e){fail++}}
  msg("목록 옮기는 중…");
  const rows=[...(d.commissions||[]).map(c=>["commissions",c]),...(d.templates||[]).map(t=>["templates",t])];
  const ts=new Date().toISOString();
  const recs=rows.map(([col,x])=>{const{id,...rest}=x;return{owner:UID,col,id,data:rest,updated_at:ts}});
  if(d.settings&&Object.keys(d.settings).length)recs.push({owner:UID,col:"settings",id:"main",data:d.settings,updated_at:ts});
  for(let i=0;i<recs.length;i+=100){const{error}=await sb.from("docs").upsert(recs.slice(i,i+100),{onConflict:"owner,col,id"});if(error)throw error}
  refreshAll();
  return{docs:recs.length,imgs:ids.length-fail,fail}}

/* ---- app icon the user can replace from settings (stored in settings/main.appIcon) ---- */
function applyAppIcon(id){
  const url=id?IMG_BASE+id:"";
  try{id?localStorage.setItem("cicon",id):localStorage.removeItem("cicon")}catch(e){}
  const base=new URL(".",location.href).href;
  const set=(rel,href)=>{let l=document.querySelector(`link[rel="${rel}"]`);if(!l){l=document.createElement("link");l.rel=rel;document.head.appendChild(l)}if(l.getAttribute("href")!==href)l.setAttribute("href",href)};
  set("icon",url||"icon-192.png");set("apple-touch-icon",url||"apple-touch-icon.png");
  if(url){const man={name:"COMMISSION 작업실",short_name:"커미션",start_url:base,scope:base,display:"standalone",background_color:"#0e0c11",theme_color:"#0e0c11",
      icons:[{src:url,sizes:"512x512",type:"image/png",purpose:"any"}]};
    set("manifest",URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"})))}
  else set("manifest","manifest.webmanifest");
  try{window.desktop&&window.desktop.setIcon&&window.desktop.setIcon(url)}catch(e){}
}
try{const i=localStorage.getItem("cicon");if(i)applyAppIcon(i)}catch(e){}
async function iconBlob(f){
  const b=await createImageBitmap(f);const s=Math.min(b.width,b.height);
  const cv=document.createElement("canvas");cv.width=cv.height=512;const x=cv.getContext("2d");
  x.fillStyle="#ffffff";x.fillRect(0,0,512,512);   // home screens need an opaque square
  x.imageSmoothingQuality="high";x.drawImage(b,(b.width-s)/2,(b.height-s)/2,s,s,0,0,512,512);b.close&&b.close();
  return new Promise(r=>cv.toBlob(r,"image/png"))}
async function setAppIcon(file){
  const old=(S.rawSettings||{}).appIcon;
  let id="";
  if(file){const blob=await iconBlob(file);id="appicon-"+newId();
    const{error}=await sb.storage.from("images").upload(id,blob,{contentType:"image/png",cacheControl:"31536000"});if(error)throw error}
  await saveSettings({appIcon:id});applyAppIcon(id);
  if(old&&old!==id)sb.storage.from("images").remove([old]).catch(()=>{})}

</script>

/* templates */
.tpl{background:var(--sheet);border:1px solid var(--rule);border-radius:0.75rem;padding:0.75rem 0.875rem}
.tpl header{display:flex;justify-content:space-between;align-items:center;gap:0.5rem;margin-bottom:0.375rem}
.tpl header strong{font-size:0.875rem}
.tpl pre{white-space:pre-wrap;font-family:var(--body);font-size:0.8438rem;margin:0;color:var(--ink);word-break:keep-all}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:0.5rem;padding:0.375rem 0.75rem;font-size:0.8125rem;font-weight:500}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pink{background:var(--pink);color:var(--on-accent);border-color:var(--pink)}
.btn.danger{color:var(--bad)}
.picker{display:flex;gap:0.5rem;align-items:center;margin-top:0.875rem;flex-wrap:wrap}
.picker select{flex:1;min-width:0;padding:0.5625rem 0.625rem;border:1px solid var(--rule);border-radius:0.625rem;background:var(--sheet)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--paper);width:100%;max-width:45rem;max-height:92%;overflow-y:auto;border-radius:1.125rem 1.125rem 0 0;padding:1rem 1rem calc(1.5rem + env(safe-area-inset-bottom,0px))}
.panel .bar{display:flex;justify-content:space-between;align-items:center;gap:0.5rem;margin-bottom:0.75rem}
.panel h3{font-family:var(--display);font-weight:700;font-size:1.3125rem;letter-spacing:-.01em;margin:0}
.steps{display:flex;gap:0.25rem;overflow-x:auto;margin-bottom:0.875rem;padding-bottom:2px}
.steps button{flex:none;border:1px solid var(--rule);background:var(--sheet);border-radius:62.4375rem;font-size:0.75rem;padding:0.3125rem 0.625rem}
.steps button[aria-pressed="true"]{background:var(--pink);color:var(--on-accent);border-color:var(--pink)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:0.625rem}
.form label{display:flex;flex-direction:column;gap:3px;font-size:0.75rem;color:var(--ink-2);min-width:0}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{padding:0.5625rem 0.625rem;border:1px solid var(--rule);border-radius:0.5625rem;background:var(--sheet);font-size:0.9375rem;min-width:0;width:100%}
.form textarea{min-height:4.375rem;resize:vertical}
.hint{font-size:0.75rem;color:var(--ink-2)}
.imgs{columns:2 8.75rem;column-gap:0.5rem;margin-top:0.5rem}
.imgs figure{break-inside:avoid;margin:0 0 0.5rem;position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:0.5rem;overflow:hidden}
.imgs img{display:block;width:100%;height:auto;cursor:zoom-in}
.imgs figcaption{font-size:0.6875rem;padding:3px 0.375rem;display:flex;justify-content:space-between;align-items:center}
.imgs figcaption button{background:none;border:0;color:var(--bad);font-size:0.6875rem;padding:0}
.upl{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-top:0.625rem}
.upl select{padding:0.4375rem 0.5rem;border:1px solid var(--rule);border-radius:0.5rem;background:var(--sheet)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.25rem;margin-top:0.625rem;padding:1.625rem 1rem;border:2px dashed var(--rule);border-radius:0.75rem;background:var(--sheet);text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop strong{font-size:0.9375rem}
.drop span{font-size:0.75rem;color:var(--ink-2)}
.drop.over{border-color:var(--pink);background:var(--pink-soft)}
.drop.busy{pointer-events:none;opacity:.7}
.foot{display:flex;gap:0.5rem;justify-content:space-between;margin-top:1.125rem;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8.125rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:0.5625rem 1rem;border-radius:62.4375rem;font-size:0.8125rem;z-index:30}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:grid;place-items:center;padding:1rem}
.viewer img{max-height:90%;max-width:100%;object-fit:contain}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:0.625rem;padding:0.625rem 0.75rem;font-size:0.8125rem;margin-top:0.75rem}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(1.5rem);opacity:.6}}}


.brandmeta{display:flex;align-items:center;gap:0.5rem}
.themeBtn{display:inline-flex;align-items:center;gap:0.375rem;border:1px solid var(--rule);background:var(--sheet);border-radius:62.4375rem;padding:0.25rem 0.625rem 0.25rem 0.375rem;font-size:0.75rem;color:var(--ink-2)}
.themeBtn svg{width:0.9375rem;height:0.9375rem;fill:none;stroke:currentColor;stroke-width:1.8}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(4rem,1fr));gap:0.625rem}
.sw{border:2px solid transparent;background:var(--sheet);border-radius:0.75rem;padding:0.5rem 0.25rem 0.375rem;display:flex;flex-direction:column;align-items:center;gap:0.3125rem;font-size:0.6875rem;color:var(--ink-2)}
.sw i{width:1.875rem;height:1.875rem;border-radius:50%;display:block}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.custom{display:flex;align-items:center;gap:0.625rem;margin-top:0.75rem;flex-wrap:wrap}
.custom input[type=color]{width:2.875rem;height:2.375rem;border:1px solid var(--rule);border-radius:0.5625rem;background:var(--sheet);padding:3px}
.custom input[type=text]{width:6.875rem;padding:0.5rem 0.625rem;border:1px solid var(--rule);border-radius:0.5625rem;background:var(--sheet);font-variant-numeric:tabular-nums}
.preview{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-top:0.875rem;padding:0.75rem;border:1px solid var(--rule);border-radius:0.75rem;background:var(--sheet)}
@media (min-width:900px){.brandmeta{width:100%;justify-content:space-between}}


.ctx{position:fixed;z-index:50;min-width:11.25rem;max-width:16.25rem;background:var(--sheet);border:1px solid var(--rule);border-radius:0.75rem;padding:0.375rem;box-shadow:0 0.625rem 1.875rem rgba(10,14,22,.22);display:flex;flex-direction:column;gap:2px}
.ctx .t{font-size:0.75rem;color:var(--ink-2);padding:0.375rem 0.625rem 0.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx button{border:0;background:none;text-align:left;padding:0.5625rem 0.625rem;border-radius:0.5rem;font-size:0.875rem;color:var(--ink);display:flex;align-items:center;gap:0.5rem}
.ctx button:hover,.ctx button:focus-visible{background:var(--paper)}
.ctx button.del{color:var(--bad)}
.ctx button.del:hover{background:color-mix(in srgb,var(--bad) 12%,var(--sheet))}
.ctx .q{font-size:0.8125rem;padding:0.5rem 0.625rem 0.25rem;line-height:1.45}
.ctx .row{display:flex;gap:0.375rem;padding:0.25rem 0.375rem 0.25rem}
.ctx .row button{flex:1;justify-content:center;border:1px solid var(--rule)}
.ctx .row button.del{background:var(--bad);color:#fff;border-color:var(--bad)}


.tile .cap .l1,.tile .cap .l2{display:flex;justify-content:space-between;gap:0.375rem;min-width:0}
.tile .cap .l1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .cap .l1 span:last-child{flex:none}
.tile .cap .l2{font-size:0.7188rem;color:var(--ink);flex-wrap:wrap;row-gap:2px;letter-spacing:-.01em}
.tile .cap .l2 span{flex:1 1 auto;text-align:center;white-space:nowrap}
.tile .cap .l2 span:first-child{text-align:left}.tile .cap .l2 span:last-child{text-align:right}
.tile .cap .l2 span+span{border-left:1px solid var(--rule)}


.pill.same{background:var(--blue-soft);color:var(--blue);font-size:0.6562rem;vertical-align:2px;margin-left:0.25rem}
.pill.regular{background:var(--pink-soft);color:var(--pink)}
.clients{display:flex;flex-direction:column;gap:0.75rem}
.client{background:var(--sheet);border:1px solid var(--rule);border-radius:0.875rem;padding:0.75rem}
.client header{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.625rem}
.client header strong{font-size:1rem}
.client header .meta{margin-left:auto;font-size:0.75rem;color:var(--ink-2)}
.client .job{background:var(--paper)}
@media (min-width:900px){.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,26.25rem),1fr));align-items:start}.client .list{grid-template-columns:1fr}}


.stcolors{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:0.5rem}
.strow{display:flex;align-items:center;gap:0.5rem;background:var(--sheet);border:1px solid var(--rule);border-radius:0.625rem;padding:0.375rem 0.5rem}
.strow .pill{flex:1;text-align:center}
.strow input[type=color]{width:2.375rem;height:1.875rem;border:1px solid var(--rule);border-radius:0.4375rem;background:var(--sheet);padding:2px}
.strow .btn{padding:0.25rem 0.5rem;font-size:0.75rem}
.strow .btn:disabled{opacity:.4}


/* calendar: days before today fade to grey */
.cal .d.past{background:color-mix(in srgb,var(--ink-2) 9%,var(--sheet))}
.cal .d.past .n{color:color-mix(in srgb,var(--ink-2) 60%,var(--sheet))}
.cal .d.past button{filter:grayscale(1);opacity:.6}
.cal .d.past button:hover,.cal .d.past button:focus-visible{filter:none;opacity:1}
.cal .d.out.past{background:color-mix(in srgb,var(--ink-2) 14%,var(--sheet))}


.steps .stedit{border-style:dashed;color:var(--ink-2)}
.stmgr{display:flex;flex-direction:column;gap:0.375rem}
.strow2{display:grid;grid-template-columns:auto 2.375rem minmax(0,1fr) 5.75rem 2.125rem auto;gap:0.375rem;align-items:center;background:var(--sheet);border:1px solid var(--rule);border-radius:0.625rem;padding:0.375rem}
.strow2 .ord{display:flex;gap:2px}
.strow2 .ord .btn{padding:3px 0.4375rem;font-size:0.75rem}
.strow2 .btn:disabled{opacity:.35}
.strow2 input[type=color]{width:2.375rem;height:2rem;border:1px solid var(--rule);border-radius:0.4375rem;background:var(--sheet);padding:2px}
.strow2 input[type=text],.strow2 select{padding:0.4375rem 0.5rem;border:1px solid var(--rule);border-radius:0.5rem;background:var(--paper);min-width:0;width:100%}
.strow2 .use{font-size:0.6875rem;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.strow2 .danger{padding:0.3125rem 0.5rem;font-size:0.75rem}
@media (max-width:520px){.strow2{grid-template-columns:auto 2.125rem minmax(0,1fr) auto;}.strow2 select{grid-column:2/4}.strow2 .use{grid-column:1}}


/* ---- tablet: more room, same phone structure ---- */
@media (min-width:600px){
  .imgs{columns:3 8.75rem}
}
/* ---- PC: sidebar on the left, content fills whatever width the window has ---- */
@media (min-width:900px){
  .wrap{max-width:none;margin:0;padding:0 clamp(1.5rem,3vw,3rem) 3rem calc(15.5rem + clamp(1.5rem,3vw,3rem))}
  header.top{position:fixed;top:0;left:0;bottom:0;width:15.5rem;margin:0;padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.125rem 1.5rem;border-bottom:0;border-right:1px solid var(--rule);background:var(--sheet);display:flex;flex-direction:column;gap:1.125rem;overflow-y:auto}
  .brand{flex-direction:column;align-items:flex-start;gap:0.5rem}
  .brand h1{font-size:1.75rem}
  .ledger{grid-template-columns:1fr;margin-top:0;gap:0.375rem}
  .ledger div{background:var(--paper)}
  .fab{position:static;width:100%;box-shadow:none;border-radius:0.625rem;padding:0.6875rem 0.875rem}
  nav.tabs{position:static;border:0;padding:0;background:none;display:block}
  nav.tabs .in{grid-template-columns:1fr;gap:2px}
  nav.tabs button{flex-direction:row;justify-content:flex-start;gap:0.75rem;padding:0.625rem 0.75rem;border-radius:0.5625rem;font-size:0.9375rem;color:var(--ink)}
  nav.tabs button:hover{background:var(--paper)}
  nav.tabs button[aria-current="true"]{background:var(--pink-soft);color:var(--pink)}
  main#view{padding-top:0.75rem}
  .search{max-width:26.25rem}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,22.5rem),1fr));gap:0.625rem}
  .gal{gap:1.125rem}
  .tile .cap{padding:0.625rem 0.75rem}
  .tile .cap strong{font-size:0.9375rem}
  .tile:hover{border-color:var(--ink-2)}
  .job:hover{border-color:var(--ink-2)}
  .cal .d{min-height:clamp(5.75rem,12vh,8.75rem);padding:0.3125rem}
  .cal .d button{font-size:0.75rem;padding:3px 0.25rem 0.25rem;gap:0.25rem}
  .cal .d button .cthumb{border-radius:0.25rem}
  .calhead{max-width:none}
  /* job sheet becomes a drawer on the right */
  .scrim{justify-content:flex-end;align-items:stretch}
  .panel{max-width:min(38.75rem,48vw);min-width:27.5rem;max-height:none;height:100%;border-radius:0;padding:1.5rem 1.75rem 2rem}
  .imgs{columns:auto 10.625rem}
  .toast{bottom:2rem}
  @media (prefers-reduced-motion:no-preference){.panel{animation:side .22s ease-out}@keyframes side{from{transform:translateX(2rem);opacity:.6}}}
}
@media (min-width:1500px){
  .list{grid-template-columns:repeat(auto-fill,minmax(25rem,1fr))}
}

/* ================= cinema layer (quiet): dark house, marquee type for titles and dates only ================= */
.brand h1{font-family:var(--marquee);font-weight:400;font-size:1.875rem;letter-spacing:.05em;line-height:1}
.brand h1 span{font-family:var(--body);font-weight:700;font-size:0.875rem;letter-spacing:.2em;color:var(--pink);margin-left:0.25rem;vertical-align:0.25rem}
.brand h1 .kicker{display:none}
.brandmeta .today{font-family:var(--marquee);letter-spacing:.1em;font-size:0.9375rem}
.ledger small{font-size:0.6875rem}
.job .dd{font-family:var(--marquee);font-size:0.9375rem;letter-spacing:.05em;color:var(--ink-2)}
.job .dd b{font-size:1.1875rem;color:var(--ink)}
.job .dd.soon b{color:var(--pink)} .job .dd.late b{color:var(--bad)}
.tile{border-color:transparent}
.calhead b{font-family:var(--marquee);font-weight:400;font-size:1.75rem;letter-spacing:.06em}
.cal .h{font-family:var(--marquee);font-size:0.8125rem;letter-spacing:.1em}
.cal .d .n{font-family:var(--marquee);font-size:0.875rem}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--pink)}
.cal .d.today .n{color:var(--on-accent)}
.cal .d.past{background:color-mix(in srgb,#000 30%,var(--sheet))}
:root[data-theme="light"] .cal .d.past{background:color-mix(in srgb,var(--ink-2) 10%,var(--sheet))}
@media (min-width:900px){.brand h1{font-size:2.25rem}.brand h1 span{display:block;margin:0.25rem 0 0;vertical-align:0}}
/* reply templates: one column that always spans the content width; spacing and type grow with the window */
.list.tpls{display:flex;flex-direction:column;gap:clamp(0.5rem,1.2vw,0.875rem);width:100%}
.list.tpls .tpl{padding:clamp(0.75rem,1.6vw,1.25rem) clamp(0.875rem,2vw,1.5rem);border-radius:clamp(0.625rem,1vw,0.875rem)}
.list.tpls .tpl header{flex-wrap:wrap;row-gap:0.5rem;margin-bottom:clamp(0.375rem,0.8vw,0.625rem)}
.list.tpls .tpl header strong{font-size:clamp(0.9rem,0.85rem + 0.25vw,1.05rem);flex:1 1 12rem;min-width:0}
.list.tpls .tpl header>span{flex:0 0 auto;margin-left:auto}
.list.tpls .tpl pre{font-size:clamp(0.85rem,0.8rem + 0.2vw,0.98rem);line-height:1.7}
.picker select{font-size:clamp(0.875rem,0.85rem + 0.15vw,0.95rem)}
@media (max-width:480px){
  .picker{flex-direction:column;align-items:stretch}
  .picker .btn{align-self:flex-end}
  .list.tpls .tpl header>span{width:100%;display:grid!important;grid-template-columns:1fr 1fr}
  .list.tpls .tpl header>span .btn{padding:0.55rem 0;text-align:center}
}

#dropHint{position:fixed;inset:0.75rem;z-index:60;pointer-events:none;border:2px dashed var(--pink);border-radius:1rem;
  background:color-mix(in srgb,var(--paper) 72%,transparent);display:grid;place-items:center}
#dropHint div{display:flex;flex-direction:column;align-items:center;gap:0.375rem;background:var(--sheet);border:1px solid var(--rule);border-radius:0.875rem;padding:1.125rem 1.5rem;text-align:center}
#dropHint strong{font-size:1.125rem;color:var(--pink)}
#dropHint span{font-size:0.8125rem;color:var(--ink-2)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:0.625rem;margin-top:1rem}
.kpis div{background:var(--sheet);border:1px solid var(--rule);border-radius:0.75rem;padding:0.875rem 1rem;display:flex;flex-direction:column;gap:0.125rem;min-width:0}
.kpis small{font-size:0.75rem;color:var(--ink-2)}
.kpis b{font-size:clamp(1.25rem,1rem + 1vw,1.75rem);font-weight:800;letter-spacing:-.01em}
.kpis span{font-size:0.75rem;color:var(--ink-2)}
.mchart{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:0.75rem;padding:0.75rem}
.mchart svg{display:block;width:100%;height:auto}
.mchart .g{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4}
.mchart .base{stroke:var(--ink-2);stroke-width:1;opacity:.5}
.mchart .gl{fill:var(--ink-2);font-size:11px}
.mchart .xl{fill:var(--ink-2);font-size:12px;text-anchor:middle}
.mchart .vl{fill:var(--ink);font-size:12px;font-weight:700;text-anchor:middle}
.mchart .bar path{fill:var(--pink);transition:opacity .15s}
.mchart .bar.dim path{opacity:.35}
.mchart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:0.75rem;padding:0.375rem 0.625rem;border-radius:0.5rem;white-space:nowrap}
.tblview{margin-top:0.5rem}
.tblview summary{cursor:pointer;font-size:0.8125rem;color:var(--ink-2)}
.tblwrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:0.75rem}
.stbl{width:100%;border-collapse:collapse;font-size:0.875rem}
.stbl th{font-weight:600;font-size:0.75rem;color:var(--ink-2);text-align:right;padding:0.625rem 0.875rem;border-bottom:1px solid var(--rule);white-space:nowrap}
.stbl td{text-align:right;padding:0.5625rem 0.875rem;border-bottom:1px solid var(--rule);white-space:nowrap}
.stbl th:first-child,.stbl td:first-child{text-align:left}
.stbl tr:last-child td{border-bottom:0}
.stbl .up{color:var(--ok)} .stbl .down{color:var(--bad)}
@media (max-width:420px){nav.tabs button{font-size:0.6875rem}}

.form .money span{display:flex;align-items:center;border:1px solid var(--rule);border-radius:0.5625rem;background:var(--sheet);padding-left:0.625rem}
.form .money span:focus-within{outline:2px solid var(--blue);outline-offset:1px}
.form .money i{font-style:normal;color:var(--ink-2);font-size:0.9375rem}
.form .money input{border:0!important;background:none!important;outline:none;padding-left:0.375rem;font-variant-numeric:tabular-nums;font-size:1rem;font-weight:600}
.moneysum{margin:-0.125rem 0 0;font-size:0.8125rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:0.375rem;align-items:baseline}
.moneysum b{color:var(--ink);font-variant-numeric:tabular-nums}
.moneysum b.up{color:var(--ok)} .moneysum b.down{color:var(--bad)}
.moneysum .dot{opacity:.5}

.panel.dropok.over{outline:2px dashed var(--pink);outline-offset:-0.5rem;background:color-mix(in srgb,var(--pink) 6%,var(--sheet))}
.panel.busy{pointer-events:auto}
.upl label.btn{cursor:pointer}

.tile{cursor:pointer}
.tile .cap .ed{border-radius:0.25rem;padding:0 0.125rem;margin:0 -0.125rem;transition:background .12s}
.tile .cap .ed:hover{background:color-mix(in srgb,var(--pink) 16%,transparent);cursor:text}
.tile .cap .ed.editing{background:none}
.tile .cap .inl{width:100%;min-width:4.5rem;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--pink);border-radius:0.3125rem;padding:0.125rem 0.25rem;text-align:inherit}
.tile .cap .l2 .inl{text-align:center}

.reordering{opacity:.6;outline:2px dashed var(--pink);outline-offset:2px;z-index:2;position:relative}
body.is-reordering{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.is-reordering .tile,body.is-reordering .cal .items>button{cursor:grabbing}
.tile,.cal .items>button{-webkit-touch-callout:none}

.mchart .bar{cursor:pointer;outline:none}
.mchart .bar.sel path{fill:var(--pink)}
.mchart .bar:not(.sel) path{fill:color-mix(in srgb,var(--pink) 45%,var(--sheet))}
.mchart .bar:focus-visible path{stroke:var(--ink);stroke-width:2}
.mchart .bar.sel .xl{fill:var(--ink);font-weight:700}
.stbl .mrow{cursor:pointer}
.stbl .mrow:hover td{background:var(--mute-soft)}


/* phone fixes: no auto-zoom when typing (iOS zooms into inputs under 16px) */
@media (hover:none) and (pointer:coarse){input,select,textarea{font-size:max(16px,1rem)!important}}
/* card price row always stays on one line: text shrinks with the card width */
.tile .cap{container-type:inline-size}
.tile .cap .l2{flex-wrap:nowrap;font-size:clamp(0.5rem,6.4cqi,0.7188rem)}
.tile .cap .l2 span{flex:1 1 auto;min-width:0;padding-inline:0.2em}
.tile .cap .l2 span:first-child{padding-left:0}.tile .cap .l2 span:last-child{padding-right:0}
/* brand logo: alpha mask painted in the theme color */
.brand{align-items:center}
.brand h1.logo{width:6.25rem;margin:0.375rem 0.5rem;aspect-ratio:640/389;flex:none;font-size:0;background:var(--pink);-webkit-mask:var(--logo) no-repeat left center/contain;mask:var(--logo) no-repeat left center/contain}
@media (min-width:900px){.brand{align-items:flex-start}.brand h1.logo{width:calc(100% - 1.5rem);max-width:11rem;margin:0.5rem 0.75rem 0.75rem}.brandmeta{padding-left:0.75rem}.brandmeta .today{font-size:0.875rem}}

/* standalone: login screen */
.login{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:var(--paper);padding:1rem}
.login form{width:min(22rem,100%);display:grid;gap:0.75rem}
.login h2{margin:0 0 0.25rem;font-size:1rem;color:var(--muted,#999);font-weight:600;letter-spacing:.1em}
.login label{display:grid;gap:0.25rem;font-size:0.8125rem}
.login input{font:inherit;padding:0.625rem 0.75rem;border-radius:0.5rem;border:1px solid var(--rule);background:var(--sheet);color:var(--ink)}
.login .logo-big{width:100%;aspect-ratio:640/389;background:var(--pink);-webkit-mask:var(--logo) no-repeat left center/contain;mask:var(--logo) no-repeat left center/contain}

const S={c:[],t:[],slots:null,tab:"list",calY:0,calM:0,q:"",galF:"all",tplFor:""};
let db=null,assets=null,downloads=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>n==null||n===""||isNaN(n)?"–":"₩"+Number(n).toLocaleString("ko-KR");
/* 작업 전 가격 = money actually received; 작업 후 가격 = what the work turned out to be worth */
const recv=c=>{const v=c.quoteBefore??c.price;return v==null||v===""||isNaN(v)?null:Number(v)};
const net=c=>{const p=recv(c);return(CANCEL.has(c.status)||!p)?0:(c.source==="크레페"?Math.round(p*0.9):p)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const pd=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dday=s=>{const d=pd(s);if(!d)return null;return Math.round((d-today())/864e5)};
const ddLbl=n=>n==null?"–":n===0?"D-DAY":n>0?"D-"+n:"D+"+(-n);
const md=s=>{const d=pd(s);return d?`${d.getMonth()+1}/${d.getDate()}`:""};
const pill=st=>`<span class="pill s-${esc((st||"").replace(/\s/g,""))}">${esc(st||"–")}</span>`;
const imgSrc=id=>IMG_BASE+id;
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function store(k,v){try{v===undefined?null:localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}


/* ---------- clients: one person, several jobs ---------- */
const clientOf=c=>(c.client||c.nick||"").trim();
function clientJobs(name,exceptId){return S.c.filter(x=>x.id!==exceptId&&clientOf(x)===name)}
function labelFor(client,seq,count){return `${client}님`+(count>1?` #${seq||1}`:"")}
function relabel(){const cnt={};S.c.forEach(c=>{if(c.client)cnt[c.client]=(cnt[c.client]||0)+1});
  S.c.forEach(c=>{if(c.client)c.nick=labelFor(c.client,c.seq,cnt[c.client])})}

/* ---------- header ---------- */
function renderHeader(){
  const t=today();$("#todayLbl").textContent=`${t.getMonth()+1}월 ${t.getDate()}일`;
  const ym=iso(t).slice(0,7);
  /* only work actually finished (sent) this month counts, by its completion date */
  const fin=S.c.filter(c=>DONE.has(c.status)&&(c.doneDate||"").startsWith(ym));
  $("#kRev").textContent=won(fin.reduce((a,c)=>a+net(c),0));
  $("#kRev").title=`이번 달 완료 ${fin.length}건 · 크레페 수수료 10% 제외`;
  $("#kAct").textContent=S.c.filter(c=>ACTIVE.has(c.status)).length+"건";
}

/* ---------- list ---------- */
function jobRow(c){
  const n=dday(c.due),cls=n==null?"":n<0&&ACTIVE.has(c.status)?"late":n<=3&&ACTIVE.has(c.status)?"soon":"";
  const sub=[c.subtype,c.source].filter(Boolean).join(" · ");
  return `<button class="job" type="button" data-open="${c.id}">
    <span class="dd ${cls}">${DONE.has(c.status)&&c.doneDate?`${md(c.doneDate)}<b style="font-size:0.6875rem;color:var(--ok)">완료</b>`:`${md(c.due)||"날짜 없음"}<b>${ACTIVE.has(c.status)?ddLbl(n):""}</b>`}</span>
    <span class="who"><strong>${esc(c.nick)}${(()=>{const k=c.client&&ACTIVE.has(c.status)?S.c.filter(x=>x.client===c.client&&ACTIVE.has(x.status)).length:0;return k>1?` <span class="pill same">${esc(c.client)} ×${k} 상영 예정</span>`:""})()}</strong><small>${esc(sub)||"&nbsp;"}</small></span>
    <span class="r">${pill(c.status)}<span class="num" title="${c.source==="크레페"?"크레페 수수료 10% 제외":"실수령액"}">${won(net(c)||recv(c))}</span></span></button>`;
}
function renderList(){
  const q=S.q.trim().toLowerCase();
  const m=c=>!q||(c.nick+" "+(c.client||"")+" "+(c.notes||"")+" "+(c.type||"")).toLowerCase().includes(q);
  const LM=S.listMode||"due";
  const act=S.c.filter(c=>ACTIVE.has(c.status)&&m(c)).sort((a,b)=>(a.due||"9")<(b.due||"9")?-1:1);
  const done=S.c.filter(c=>!ACTIVE.has(c.status)&&m(c)&&!c.archive);
  /* finished work grouped by the month it was completed; cancelled jobs kept apart */
  const cancelled=done.filter(c=>CANCEL.has(c.status));
  const groups={};done.filter(c=>!CANCEL.has(c.status)).forEach(c=>{const k=c.doneDate?c.doneDate.slice(0,7):"없음";(groups[k]=groups[k]||[]).push(c)});
  const keys=Object.keys(groups).filter(k=>k!=="없음").sort().reverse();if(groups["없음"])keys.push("없음");
  const arch=S.c.filter(c=>c.archive&&m(c));
  let h=`<div class="seg" role="tablist" style="margin-top:0.875rem;max-width:22.5rem"><button type="button" role="tab" data-lm="due" aria-selected="${LM==="due"}">마감 순</button><button type="button" role="tab" data-lm="client" aria-selected="${LM==="client"}">의뢰인별</button></div>`;
  h+=`<input class="search" id="q" type="search" placeholder="의뢰인·메모 검색" value="${esc(S.q)}">`;
  if(LM==="client"){h+=clientView(m);$("#view").innerHTML=h;wireSearch();return}
  h+=`<h2 class="sec">상영 예정<span class="meta">${act.length}건 · 마감 순</span></h2>`;
  h+=act.length?`<div class="list">${act.map(jobRow).join("")}</div>`:`<div class="empty">상영 예정인 커미션이 없어요. 아래 ＋ 새 커미션으로 추가하세요.</div>`;
  keys.forEach(k=>{const g=groups[k].sort((a,b)=>(b.doneDate||b.due||"")>(a.doneDate||a.due||"")?1:-1);const tot=g.reduce((a,c)=>a+net(c),0);
    const lbl=k==="없음"?"완료일 없음":`${Number(k.slice(5))}월 개봉`;
    h+=`<h2 class="sec">${lbl}<span class="meta">${g.length}건 · ${k==="없음"?"수익 계산에서 빠짐":`수익 <span class="num">${won(tot)}</span>`}</span></h2><div class="list">${g.map(jobRow).join("")}</div>`});
  if(cancelled.length)h+=`<h2 class="sec">취소<span class="meta">${cancelled.length}건 · 수익 계산에서 빠짐</span></h2><div class="list">${cancelled.sort((a,b)=>(b.due||"")>(a.due||"")?1:-1).map(jobRow).join("")}</div>`;
  if(arch.length)h+=`<h2 class="sec">이전 작업<span class="meta">노션에서 옮김 · ${arch.length}건</span></h2><div class="list">${arch.map(jobRow).join("")}</div>`;
  $("#view").innerHTML=h;wireSearch();
}
function wireSearch(){const qi=$("#q");qi.addEventListener("input",e=>{S.q=e.target.value;const p=e.target.selectionStart;renderList();const n=$("#q");n.focus();n.setSelectionRange(p,p)})}
function clientView(m){
  const by=new Map();S.c.filter(m).forEach(c=>{const k=clientOf(c);if(!by.has(k))by.set(k,[]);by.get(k).push(c)});
  const last=g=>g.reduce((a,c)=>{const d=c.due||c.doneDate||"";return d>a?d:a},"");
  const rows=[...by.entries()].sort((a,b)=>{const ac=a[1].some(c=>ACTIVE.has(c.status)),bc=b[1].some(c=>ACTIVE.has(c.status));
    if(ac!==bc)return ac?-1:1;return last(b[1])>last(a[1])?1:last(b[1])<last(a[1])?-1:0});
  if(!rows.length)return`<div class="empty" style="margin-top:1rem">찾는 의뢰인이 없어요.</div>`;
  const repeat=rows.filter(([,g])=>g.filter(c=>!CANCEL.has(c.status)).length>1).length;
  let h=`<h2 class="sec">의뢰인<span class="meta">${rows.length}명 · 단골 ${repeat}명</span></h2><div class="clients">`;
  rows.forEach(([name,g])=>{const jobs=[...g].sort((a,b)=>(a.seq||1)-(b.seq||1)||((a.due||"")<(b.due||"")?-1:1));
    const valid=jobs.filter(c=>!CANCEL.has(c.status));const total=valid.reduce((a,c)=>a+net(c),0);
    const act=jobs.filter(c=>ACTIVE.has(c.status)).length;
    h+=`<section class="client"><header><strong>${esc(name)}님</strong>${valid.length>1?`<span class="pill regular">단골</span>`:""}<span class="meta">의뢰 ${valid.length}건 · 총 <span class="num">${won(total)}</span>${act?` · 상영 예정 ${act}`:""}</span></header><div class="list">${jobs.map(jobRow).join("")}</div></section>`});
  return h+`</div>`;
}

/* ---------- calendar ---------- */
function renderCal(){
  const y=S.calY,m=S.calM,first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
  /* finished work sits on its completion date when it has one; everything else on its deadline */
  const calDate=c=>DONE.has(c.status)&&c.doneDate?c.doneDate:c.due;
  const byDay={};S.c.forEach(c=>{const k=calDate(c);if(k&&!CANCEL.has(c.status))(byDay[k]=byDay[k]||[]).push(c)});
  Object.values(byDay).forEach(g=>g.sort(byDayOrder));
  const tIso=iso(today());
  let h=`<div class="calhead"><button type="button" id="pm" aria-label="이전 달">‹</button><b>${y}. ${m+1}</b><button type="button" id="nm" aria-label="다음 달">›</button></div><div class="cal">`;
  "일월화수목금토".split("").forEach(d=>h+=`<div class="h">${d}</div>`);
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);
    if(i>=35&&d.getMonth()!==m)break;
    h+=`<div class="d${d.getMonth()!==m?" out":""}${k===tIso?" today":""}${k<tIso?" past":""}"><span class="n">${d.getDate()}</span>${(byDay[k]||[]).length?`<div class="items">`:""}${(byDay[k]||[]).map(c=>`<button type="button" class="pill s-${esc(c.status.replace(/\s/g,""))}" data-open="${c.id}" data-dk="${k}" title="${esc(c.nick)}"><span>${esc(c.nick)}</span></button>`).join("")}${(byDay[k]||[]).length?`</div>`:""}</div>`}
  h+=`</div><p class="hint" style="margin-top:0.625rem">색: <span class="pill s-예약">예약</span> <span class="pill s-입금확인">입금확인</span> <span class="pill s-중간확인완료">상영 예정</span> <span class="pill s-완성본전송">완료</span></p>`;
  $("#view").innerHTML=h;
  $("#pm").onclick=()=>{S.calM--;if(S.calM<0){S.calM=11;S.calY--}renderCal()};
  $("#nm").onclick=()=>{S.calM++;if(S.calM>11){S.calM=0;S.calY++}renderCal()};
}

/* ---------- gallery ---------- */
/* calendar: finished work shows its final image, work in progress its latest rough/draft */
function calThumb(c){return DONE.has(c.status)?cover(c):latest(c)}
function cover(c){const im=c.images||[];const f=im.find(x=>x.kind==="완성본")||im[im.length-1];return f?f.id:null}

/* card caption: type / date, then before price / difference / after price */
const man=won;
function capLines(c,V){
  const type=c.subtype||c.type||"타입 없음";
  const date=V==="wip"?(c.due?`${md(c.due)} 마감 · ${ddLbl(dday(c.due))}`:"마감일 없음"):(c.doneDate?md(c.doneDate):"완료일 없음");
  const b=recv(c),a=c.quoteAfter??null;
  const has=b!=null&&a!=null;const d=has?a-b:null;
  const diff=d==null?"–":d===0?"±₩0":(d>0?"+":"−")+won(Math.abs(d));
  const dc=d>0?"var(--ok)":d<0?"var(--bad)":"var(--ink-2)";
  const df=V==="wip"?"due":"doneDate";
  return `<small class="l1"><span class="ed" data-ed="subtype" title="눌러서 수정">${esc(c.subtype||"타입 없음")}</span><span class="num ed" data-ed="${df}" title="눌러서 수정">${esc(date)}</span></small>
    <small class="l2 num"><span class="ed" data-ed="quoteBefore" title="작업 전 가격 · 눌러서 수정">${man(b)}</span><span style="color:${dc};font-weight:600">${diff}</span><span class="ed" data-ed="quoteAfter" title="작업 후 가격 · 눌러서 수정">${man(a)}</span></small>`;
}
const priceOf=c=>recv(c)||0;
function latest(c){const im=(c.images||[]).filter(x=>x.kind!=="레퍼런스");const f=im[im.length-1]||(c.images||[])[0];return f?f.id:null}
/* finished = sent to the client; in progress = still being worked on (rough / draft stage) */
const hasFinal=c=>(c.images||[]).some(x=>x.kind==="완성본");
const isDone=c=>DONE.has(c.status);
const isWip=c=>!CANCEL.has(c.status)&&!isDone(c);
function stage(c){const im=(c.images||[]).filter(x=>x.kind!=="레퍼런스");
  if(hasFinal(c))return"완성본";if(im.some(x=>x.kind==="시안"))return"시안";if(im.some(x=>x.kind==="러프"))return"러프";return c.status}
function renderGal(){
  const V=S.galV||"done";
  const doneAll=S.c.filter(isDone),wipAll=S.c.filter(isWip);
  let list=V==="wip"?wipAll:doneAll;
  /* work-time order: finished = most recently finished first; in progress = nearest deadline first */
  /* finished work: by completion date, newest first; entries without one follow, newest deadline first */
  const desc=(x,y)=>x>y?-1:x<y?1:0;
  list=[...list].sort(V==="wip"?((a,b)=>((a.due||"9")<(b.due||"9")?-1:(a.due||"9")>(b.due||"9")?1:0)||byDayOrder(a,b))
    :((a,b)=>(!!b.doneDate-!!a.doneDate)||desc(a.doneDate||"",b.doneDate||"")||byDayOrder(a,b)||desc(a.due||"",b.due||"")||(b.order||0)-(a.order||0)));
  const SO=S.galSort||"time";
  let h=`<div class="seg" role="tablist" style="margin-top:0.875rem"><button type="button" role="tab" data-gv="done" aria-selected="${V==="done"}">상영 중 <span class="num">${doneAll.length}</span></button><button type="button" role="tab" data-gv="wip" aria-selected="${V==="wip"}">상영 예정 · 러프/시안 <span class="num">${wipAll.length}</span></button></div>`;
  const withImg=S.c.filter(c=>(c.images||[]).length).length;
  if(!withImg)h+=`<div class="notice">노션에 있던 이미지는 아직 노션에 있어요. 노션에서 이미지를 저장한 뒤 이 화면에 끌어다 놓거나 붙여넣으면 파일명으로 커미션을 찾아 연결해요.</div>`;
  const tile=c=>{const id=V==="wip"?latest(c):cover(c);const n=(c.images||[]).length;const st=stage(c);
    return `<div class="tile" role="button" tabindex="0" style="--r:${ratioOf(c,id)}" data-open="${c.id}" data-dk="${esc((V==="wip"?c.due:c.doneDate)||"")}">${id?`<img class="pic" draggable="false" data-aid="${id}" src="${imgSrc(id)}" alt="${esc(c.nick)} 작업물" loading="lazy">`:`<span class="ph">${V==="wip"?"아직 올린 시안 없음":c.notionUrl?"노션에 보관 중":"이미지 없음"}</span>`}
    <span class="cap"><strong>${esc(c.nick)}</strong>${capLines(c,V)}</span></div>`};
  h+=`<div class="rowtrack" style="margin-top:0.625rem"><button type="button" class="chip" data-gs="time" aria-pressed="${SO==="time"}">${V==="wip"?"마감 순":"작업 순"}</button><button type="button" class="chip" data-gs="price" aria-pressed="${SO==="price"}">가격대별</button></div>`;
  if(SO==="time"){
    if(!list.length)h+=`<div class="empty" style="margin-top:1rem">${V==="wip"?"상영 예정인 커미션이 없어요.":"상영 중인 작품이 아직 없어요."}</div>`;
    else if(V==="wip")h+=`<h2 class="sec">상영 예정<span class="meta">${list.length}건 · 마감 가까운 순</span></h2><div class="gal">${list.map(tile).join("")}</div>`;
    else{const dated=list.filter(c=>c.doneDate),undated=list.filter(c=>!c.doneDate);
      if(dated.length)h+=`<h2 class="sec">상영 중<span class="meta">${dated.length}건 · 최근 완료 순</span></h2><div class="gal">${dated.map(tile).join("")}</div>`;
      if(undated.length)h+=`<h2 class="sec">완료일 없음<span class="meta">${undated.length}건 · 마감일 순</span></h2>
        <div class="notice" style="display:flex;gap:0.625rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 0.75rem">완료일이 비어 있어 순서를 정할 수 없는 작업이에요. 각 커미션의 ‘완료일’ 칸을 채우면 위로 올라가요.${undated.some(c=>c.due)?`<button class="btn" type="button" id="fillDone">마감일로 완료일 채우기</button>`:""}</div>
        <div class="gal">${undated.map(tile).join("")}</div>`}
    $("#view").innerHTML=h;layoutGal();wireBulk();
    const fd=$("#fillDone");if(fd)fd.onclick=()=>{const targets=list.filter(c=>!c.doneDate&&c.due);
      fd.outerHTML=`<span style="display:flex;gap:0.375rem;align-items:center;flex-wrap:wrap">${targets.length}건의 완료일을 마감일과 같게 넣을까요? <button class="btn" type="button" id="fdNo">취소</button><button class="btn pri" type="button" id="fdYes">채우기</button></span>`;
      $("#fdNo").onclick=renderGal;
      $("#fdYes").onclick=async()=>{$("#fdYes").disabled=true;let ok=0;
        for(const c of targets){try{await db.collection("commissions").doc(c.id).update({doneDate:c.due});ok++}catch(e){}}
        toast(`${ok}건의 완료일을 채웠어요`)}};
    return;
  }
  /* group by price in 10,000-won steps, highest first; no price goes last */
  const groups=new Map();
  list.forEach(c=>{const p=priceOf(c);const k=p?Math.floor(p/10000):-1;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(c)});
  const keys=[...groups.keys()].sort((a,b)=>b-a);
  if(!list.length)h+=`<div class="empty" style="margin-top:1rem">${V==="wip"?"상영 예정인 커미션이 없어요.":"상영 중인 작품이 아직 없어요."}</div>`;
  if(keys.length>1)h+=`<div class="rowtrack" style="margin-top:0.75rem">${keys.map(k=>`<a class="chip" href="#p${k}" data-jump="p${k}">${k<0?"가격 미정":won(k*10000)} <span class="num" style="color:var(--ink-2)">${groups.get(k).length}</span></a>`).join("")}</div>`;
  keys.forEach(k=>{const g=groups.get(k);const exact=k>=0&&g.every(c=>priceOf(c)===k*10000);
    const label=k<0?"가격 미정":exact?won(k*10000):`${won(k*10000)}대`;
    h+=`<h2 class="sec" id="p${k}">${label}<span class="meta">${g.length}건</span></h2><div class="gal">${g.map(tile).join("")}</div>`});
  $("#view").innerHTML=h;layoutGal();wireBulk();
}
function wireBulk(){}



/* justified gallery: rows sized so 3 portrait posters (2 on phones) fill a row; each row is scaled to the exact width */
function layoutGal(){document.querySelectorAll(".gal").forEach(g=>{
  const W=g.clientWidth-1;if(W<=0)return;
  const gap=parseFloat(getComputedStyle(g).columnGap)||10;
  const cols=W>=560?3:2;const target=((W-gap*(cols-1))/cols)/.719;
  const tiles=[...g.children].filter(t=>t.classList.contains("tile"));
  const r=t=>parseFloat(t.style.getPropertyValue("--r"))||.719;
  const place=(row,h)=>row.forEach(t=>{t.style.width=(r(t)*h).toFixed(2)+"px"});
  let row=[],sum=0;
  tiles.forEach((t,i)=>{row.push(t);sum+=r(t);
    const full=sum*target+gap*(row.length-1)>=W;
    if(full){place(row,(W-gap*(row.length-1))/sum);row=[];sum=0}});
  if(row.length){let h=(W-gap*(row.length-1))/sum;if(h>target*1.6)h=target;place(row,h)}
})}

/* image aspect ratios: saved with each upload; older images are measured once when they load */
const RATIO=new Map();
function ratioOf(c,id){if(!id)return .719;const im=(c.images||[]).find(x=>x.id===id);const r=(im&&im.r)||RATIO.get(id);return r?Math.min(3,Math.max(.33,r)).toFixed(3):.719}

  const r=im.naturalWidth/im.naturalHeight;const id=im.dataset.aid;if(id)RATIO.set(id,r);
  const t=im.closest(".tile");if(t){t.style.setProperty("--r",Math.min(3,Math.max(.33,r)).toFixed(3));layoutGalSoon()}},true);
async function imgMeta(f){try{const b=await createImageBitmap(f);const r=b.width/b.height;b.close&&b.close();return{r:+r.toFixed(4)}}catch(e){return{}}}

document.addEventListener("paste",e=>{

  const files=[...(e.clipboardData?.items||[])].filter(it=>it.kind==="file"&&/^image\//.test(it.type)).map((it,i)=>{
    const f=it.getAsFile();if(!f)return null;

    const stamp=new Date();const nm=(f.name&&f.name!=="image.png")?f.name:`붙여넣기_${iso(stamp).replace(/-/g,"").slice(2)}_${String(stamp.getHours()).padStart(2,"0")}${String(stamp.getMinutes()).padStart(2,"0")}${String(stamp.getSeconds()).padStart(2,"0")}${i?"_"+i:""}.${ext}`;
    return new File([f],nm,{type:f.type,lastModified:Date.now()})}).filter(Boolean);
  if(!files.length)return;

/* ---------- bulk upload: match file names to commissions ---------- */
const norm=s=>String(s||"").normalize("NFC").toLowerCase().replace(/\.[a-z0-9]+$/,"").replace(/님|커미션|commission/g,"").replace(/[\s_\-.()\[\]·,#]+/g,"");
function guessKind(name){const n=name.toLowerCase();
  if(/러프|rough/.test(n))return"러프";if(/시안|draft|sketch|스케치/.test(n))return"시안";
  if(/레퍼|ref/.test(n))return"레퍼런스";return"완성본"}
function matchCommission(name){
  const f=norm(name);let best=null,len=0;
  for(const c of S.c){const k=norm(c.nick);if(k&&f.includes(k)&&k.length>len){best=c;len=k.length}}
  return best}
function bulkReview(all){
  const files=all.filter(f=>/^image\//.test(f.type));
  if(!files.length){toast("이미지 파일만 올릴 수 있어요");return}
  const rows=files.map(f=>({f,c:matchCommission(f.name),kind:guessKind(f.name),url:URL.createObjectURL(f)}));
  const sorted=[...S.c].sort((a,b)=>a.nick.localeCompare(b.nick,"ko"));
  const matched=rows.filter(r=>r.c).length;
  shell(`<div class="bar"><h3>작업물 ${rows.length}장 올리기</h3><button class="btn" type="button" id="x">닫기</button></div>
   <p class="hint">${matched}장은 파일명으로 커미션을 찾았어요.${rows.length-matched?` 못 찾은 ${rows.length-matched}장은 직접 골라 주세요. 고르지 않으면 건너뛰어요.`:""}</p>
   <div class="list" style="margin-top:0.625rem">${rows.map((r,i)=>`<div class="tpl" style="display:grid;grid-template-columns:4rem 1fr;gap:0.625rem;align-items:center">
     <img src="${r.url}" alt="" style="width:4rem;height:auto;border-radius:0.375rem">
     <div style="display:flex;flex-direction:column;gap:0.375rem;min-width:0"><small style="overflow-wrap:anywhere;color:var(--ink-2)">${esc(r.f.name)}</small>
      <div style="display:flex;gap:0.375rem;flex-wrap:wrap"><select data-bc="${i}" aria-label="커미션" style="flex:1;min-width:0;padding:0.4375rem;border:1px solid ${r.c?"var(--rule)":"var(--pink)"};border-radius:8px;background:var(--sheet)"><option value="">— 건너뛰기 —</option>${sorted.map(c=>`<option value="${c.id}"${r.c&&r.c.id===c.id?" selected":""}>${esc(c.nick)}${c.due?" · "+md(c.due):""}</option>`).join("")}</select>
      <select data-bk="${i}" aria-label="종류" style="padding:0.4375rem;border:1px solid var(--rule);border-radius:0.5rem;background:var(--sheet)">${opts(KINDS,r.kind)}</select></div></div></div>`).join("")}</div>
   <div class="foot"><span class="hint" id="bulkMsg"></span><button class="btn pri" type="button" id="go">올리기</button></div>`);
  const done=()=>{rows.forEach(r=>URL.revokeObjectURL(r.url));close()};
  $("#x").onclick=done;
  $("#go").onclick=async()=>{
    const plan=rows.map((r,i)=>({f:r.f,id:document.querySelector(`[data-bc="${i}"]`).value,kind:document.querySelector(`[data-bk="${i}"]`).value})).filter(p=>p.id);
    if(!plan.length){toast("올릴 커미션을 골라 주세요");return}
    const go=$("#go");go.disabled=true;let ok=0,fail=0;const added={};
    let skip=0;
    for(const p of plan){$("#bulkMsg").textContent=`올리는 중… ${ok+fail+skip+1}/${plan.length}`;
      const tgt=S.c.find(x=>x.id===p.id);if((tgt&&isDup(tgt,p.f))||(added[p.id]||[]).some(x=>x.name===p.f.name&&x.size===p.f.size)){skip++;continue}
      try{const meta=await imgMeta(p.f);const r=await assets.upload(p.f,{type:p.f.type||"image/png"});(added[p.id]=added[p.id]||[]).push({id:r.id,kind:p.kind,name:p.f.name,size:p.f.size,...meta,at:iso(today())});ok++}
      catch(e){fail++;if(e.code==="quota_or_state"){toast("저장 공간이 가득 찼어요");break}}}
    for(const id of Object.keys(added)){const cur=S.c.find(x=>x.id===id);if(!cur)continue;
      const c=structuredClone(cur);c.images=[...(c.images||[]),...added[id]];await saveDoc(c,true)}
    toast(`${ok}장 올렸어요`+(skip?` · 이미 있는 ${skip}장은 건너뜀`:"")+(fail?` · ${fail}장 실패`:""));done();
  };
}

const HEX=/^#[0-9a-f]{6}$/i;
function lum(hex){const n=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*n[0]+.7152*n[1]+.0722*n[2]}
function applyTheme(accent,mode){
  const r=document.documentElement;
  if(accent&&HEX.test(accent)){r.style.setProperty("--pink",accent);r.style.setProperty("--pink-soft",`color-mix(in srgb, ${accent} 16%, var(--sheet))`);r.style.setProperty("--on-accent",lum(accent)>.45?"#1d2433":"#ffffff")}
  else{["--pink","--pink-soft","--on-accent"].forEach(p=>r.style.removeProperty(p))}
  if(mode==="light"||mode==="dark")r.setAttribute("data-theme",mode);else if(mode==="auto")r.removeAttribute("data-theme");
  S.accent=accent||"";S.mode=mode||"auto";
  store("theme",JSON.stringify({accent:S.accent,mode:S.mode,status:S.statusColors||{}}));
}

function applyStatusDefs(defs){

  STATUSES=S.statusDefs.map(d=>d.name);
  ACTIVE=new Set(S.statusDefs.filter(d=>d.kind==="active").map(d=>d.name));
  DONE=new Set(S.statusDefs.filter(d=>d.kind==="done").map(d=>d.name));
  CANCEL=new Set(S.statusDefs.filter(d=>d.kind==="cancel").map(d=>d.name));
  applyStatusColors(Object.fromEntries(S.statusDefs.map(d=>[d.name,d.color])));
}

/* ---------- stats ---------- */
function renderStats(){
  const done=S.c.filter(c=>DONE.has(c.status));
  const priced=done.filter(c=>recv(c)>0);
  const total=priced.reduce((a,c)=>a+net(c),0);
  const avg=priced.length?Math.round(priced.reduce((a,c)=>a+recv(c),0)/priced.length):null;
  const both=S.c.filter(c=>!CANCEL.has(c.status)&&recv(c)!=null&&c.quoteAfter!=null);
  const dOf=c=>c.quoteAfter-recv(c);
  const avgDiff=both.length?Math.round(both.reduce((a,c)=>a+dOf(c),0)/both.length):null;
  const sign=v=>v==null?"–":v===0?"±₩0":(v>0?"+":"−")+won(Math.abs(v));
  // monthly revenue by completion month, last 12 months that have data
  const by={};done.forEach(c=>{if(!c.doneDate)return;const k=c.doneDate.slice(0,7);(by[k]=by[k]||{v:0,n:0});by[k].v+=net(c);by[k].n++});
  const months=Object.keys(by).sort().slice(-12);
  // type table
  const T={};
  /* 타입 = ①심플 ~ ④번외; jobs without one are left out of the table */
  S.c.filter(c=>!CANCEL.has(c.status)&&c.subtype).forEach(c=>{(T[c.subtype]=T[c.subtype]||[]).push(c)});
  const avgOf=(arr,f)=>{const v=arr.map(f).filter(x=>x!=null&&!isNaN(x));return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null};
  const rows=Object.entries(T).map(([k,g])=>({k,n:g.length,b:avgOf(g,recv),a:avgOf(g,c=>c.quoteAfter),d:avgOf(g.filter(c=>recv(c)!=null&&c.quoteAfter!=null),dOf)})).sort((x,y)=>y.n-x.n);
  let h=`<div class="kpis">
    <div><small>누적 수익</small><b class="num">${won(total)}</b><span>상영 중 ${done.length}편 · 수수료 제외</span></div>
    <div><small>평균 단가</small><b class="num">${won(avg)}</b><span>가격 있는 ${priced.length}편 기준</span></div>
    <div><small>평균 차액</small><b class="num">${sign(avgDiff)}</b><span>작업 전 → 작업 후 · ${both.length}편</span></div></div>`;
  h+=`<h2 class="sec">월별 수익<span class="meta">완료일 기준 · 수수료 제외</span></h2>`;
  h+=months.length?`<div class="mchart" id="mchart">${monthChart(months.map(k=>({k,...by[k]})))}</div><div id="mlist"></div>`:`<div class="empty">완료일이 있는 작업이 아직 없어요.</div>`;
  if(!S.statMonth||!by[S.statMonth])S.statMonth=months[months.length-1];
  $("#view").innerHTML=h;wireChart();
}
function monthChart(data){
  const W=720,H=240,pl=8,pr=8,pt=26,pb=28;const max=Math.max(...data.map(d=>d.v),1);
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const m=max/p;return (m<=2?2:m<=5?5:10)*p})();
  const iw=W-pl-pr,ih=H-pt-pb,bw=Math.min(56,iw/data.length*.62),step=iw/data.length;
  const y=v=>pt+ih-(v/nice)*ih;
  const grid=[.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(nice*f)}" y2="${y(nice*f)}" class="g"/><text x="${pl}" y="${y(nice*f)-5}" class="gl">${won(nice*f)}</text>`).join("");
  const best=data.reduce((a,d)=>d.v>a.v?d:a,data[0]);
  const bars=data.map((d,i)=>{const x=pl+step*i+(step-bw)/2,top=y(d.v),hgt=Math.max(0,pt+ih-top),r=Math.min(4,bw/2,hgt);
    const path=hgt>0?`M${x},${pt+ih}V${top+r}Q${x},${top} ${x+r},${top}H${x+bw-r}Q${x+bw},${top} ${x+bw},${top+r}V${pt+ih}Z`:"";
    return `<g class="bar" data-i="${i}" data-k="${d.k}" role="button" tabindex="0" aria-label="${Number(d.k.slice(5))}월 작업 보기" data-tip="${Number(d.k.slice(5))}월 · ${won(d.v)} · ${d.n}편"><rect x="${pl+step*i}" y="${pt}" width="${step}" height="${ih}" fill="transparent"/>${path?`<path d="${path}"/>`:""}
      ${d===best?`<text x="${x+bw/2}" y="${top-6}" class="vl">${won(d.v)}</text>`:""}
      <text x="${x+bw/2}" y="${H-8}" class="xl">${d.k.slice(2,4)==="26"?Number(d.k.slice(5))+"월":d.k.slice(2).replace("-",".")}</text></g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 수익 막대 그래프">${grid}<line x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}" class="base"/>${bars}</svg><div class="tip" id="ctip" hidden></div>
  <details class="tblview"><summary>표로 보기</summary><table class="stbl"><thead><tr><th>월</th><th>수익</th><th>편수</th></tr></thead><tbody>${data.map(d=>`<tr data-k="${d.k}" class="mrow"><td>${d.k}</td><td class="num">${won(d.v)}</td><td class="num">${d.n}</td></tr>`).join("")}</tbody></table></details>`;
}

  if(!db){$("#view").innerHTML=`<div class="empty" style="margin-top:1.25rem">저장소에 연결할 수 없어요. 로그인한 상태로 다시 열어 주세요.</div>`;return}
  let first=true;
  db.collection("commissions").onSnapshot(s=>{S.c=s.docs.map(d=>({id:d.id,...d.data()}));relabel();
    if(!document.querySelector(".scrim")||first)render();else renderHeader();first=false},
    e=>{$("#view").innerHTML=`<div class="empty">목록을 불러오지 못했어요. 새로고침해 주세요.</div>`});
  db.collection("templates").orderBy("order").onSnapshot(s=>{S.t=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="tpl"&&!document.querySelector(".scrim"))renderTpl()},()=>{});
  db.doc("settings/main").onSnapshot(s=>{const d=s.exists?s.data():{};S.rawSettings=d;S.settingsExists=s.exists;applyAppIcon(d.appIcon||"");S.slots=d.slots??null;applyTheme(d.accent,d.mode);applyStatusDefs(Array.isArray(d.statuses)&&d.statuses.length?d.statuses:STATUS_DEFS_DEFAULT.map(x=>({...x,color:(d.statusColors||{})[x.name]||x.color})));if(!document.querySelector(".scrim"))render();else renderHeader()},()=>{});
})();
</script>
